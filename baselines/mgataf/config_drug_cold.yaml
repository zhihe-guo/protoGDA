# MGATAF — Drug cold split (new drug test)
# Hyperparameters faithfully aligned with Saeed et al. (2025) BMC Bioinformatics:
#   Adam, lr=5e-4, weight_decay=5e-4, dropout=0.3, max 300 epochs,
#   early stopping if val loss does not drop for 50 epochs.
# IC50 is normalized to [0,1] before training to match the paper's scale.

data:
  dataset_name: GDSC2
  batch_size: 128
  num_workers: 4
  pin_memory: true
  split_mode: drug_cold
  genomic_path: data/gdsc_genomic.csv
  cell_pca_dim: 0

model:
  gnn_hidden_dim: 64
  num_gnn_layers: 3
  gat_heads_first: 8
  gat_heads_rest: 1
  cell_output_dim: 64
  fp_output_dim: 64
  dropout: 0.3

training:
  epochs: 300
  lr: 5.0e-4
  weight_decay: 5.0e-4
  scheduler: cosine
  warmup_epochs: 5
  lr_reduce_patience: 10
  lr_reduce_factor: 0.5
  lr_min: 1.0e-6
  early_stopping_patience: 10
  seed: 42
  device: auto
  checkpoint_dir: checkpoints/mgataf_drug_cold
  log_every: 50
  gradnorm_monitor: true

# MGATAF — Interpolation split (随机划分, mixed test)
# Model architecture: faithful to Saeed et al. (2025) BMC Bioinformatics.
#   Added BatchNorm after Conv-Flatten in CellLineEncoder & FingerprintEncoder
#   to stabilize the massive FC layers (32×677=21K → 64). Without BN, model
#   collapses to near-constant predictions on full dataset.
# Training: paper-recommended values.
#   Adam, lr=5e-4, weight_decay=5e-4, dropout=0.3, patience=50, max 300 epochs
# IC50 is normalized to [0,1] before training to match the paper's scale.
#
# Paper GDSC v6 results (reference): Mixed PCC=0.9312 RMSE=0.0225

data:
  dataset_name: GDSC2
  batch_size: 128
  num_workers: 4
  pin_memory: true
  split_mode: interpolation
  genomic_path: data/gdsc_genomic.csv
  cell_pca_dim: 0

model:
  gnn_hidden_dim: 64
  num_gnn_layers: 3
  gat_heads_first: 8
  gat_heads_rest: 1
  cell_output_dim: 64
  fp_output_dim: 64
  dropout: 0.3

training:
  epochs: 300
  lr: 1.0e-3
  weight_decay: 0.0
  scheduler: plateau
  warmup_epochs: 0
  lr_reduce_patience: 10
  lr_reduce_factor: 0.5
  lr_min: 1.0e-6
  early_stopping_patience: 10
  seed: 42
  device: auto
  checkpoint_dir: checkpoints/mgataf_interpolation
  log_every: 50
  gradnorm_monitor: true

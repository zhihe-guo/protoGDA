# GraphDRP — v3 scaffold-cold protocol (six folds are injected by cv_runner.py).
data:
  dataset_name: GDSC2
  batch_size: 128
  num_workers: 4
  pin_memory: true
  split_mode: scaffold_cold

model:
  gnn_type: gin
  num_gnn_layers: 5
  hidden_dim: 32
  gnn_dropout: 0.2
  drug_output_dim: 128
  cell_mode: gene_expression
  cell_output_dim: 128
  dropout: 0.3

training:
  epochs: 60
  lr: 5.0e-4
  weight_decay: 1.0e-4
  scheduler: plateau
  warmup_epochs: 0
  lr_reduce_patience: 7
  lr_reduce_factor: 0.5
  lr_min: 1.0e-6
  early_stopping_patience: 999
  checkpoint_metric: pearson_r
  seed: 42
  device: auto
  checkpoint_dir: checkpoints/cv_graphdrp_scaffold_cold_v3
  log_every: 50
  gradnorm_monitor: false
